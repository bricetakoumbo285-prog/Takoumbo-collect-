name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: PrÃ©parer les dossiers et les images
        run: |
          mkdir -p www scripts assets
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ -f patch-android.js ]; then cp patch-android.js scripts/patch-android.js; fi
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do
            if [ -f "$f" ]; then cp "$f" assets/; fi
          done
          if [ -f logo.png ]; then cp logo.png www/logo.png; fi
          ls www assets scripts
      - run: npx cap add android
      - run: npx --yes @capacitor/assets generate --android
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: patrouille-foret-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
